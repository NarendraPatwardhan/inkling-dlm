# GPU gates only, without Drive (small experiment, < 5 CU): state and gates.json stay on the VM disk.
name: gates
device: cuda
dtype: bfloat16
experts_impl: unsloth_packed
updates: 25000
examples_per_update: 16
lora_r: 1024
lora_alpha: 1024
micro_blocks: 64
grad_ckpt: true
run_dir: /content/inkling-dlm/runs/gates
stage_dir: /content/stage
cache_dir: /content/inkling-dlm/cache
gate_updates: 20
cu_per_hour: 8.88
cu_limit: 200
mem_limit_gb: 36
# Memory/speed ladder (gates.choose_setting): every [grad_ckpt, micro_blocks] is probed on the worst-memory update
# (16 rows with the most blocks) plus probe_updates timed updates; the fastest that fits mem_limit_gb (allocated) and
# 95 % of the card (reserved) is kept in gates.json. If none fits, the same ladder with the expert decode bounded to
# dequant_fallback_mb. Sizing in docs/RUNBOOK.md ("Batch sizing on 40 GB").
gate_settings: [[true, 128], [true, 64], [true, 32], [false, 16]]
probe_updates: 4
dequant_chunk_mb: null
dequant_fallback_mb: 192
wandb_mode: online
wandb_key_file: /content/wandb.key
tags: [a100, gates]
